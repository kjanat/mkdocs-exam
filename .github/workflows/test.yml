name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Run Python tests with coverage
        run: |
          uv run pytest tests/ --cov=mkdocs_exam --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: python
          name: python-${{ matrix.python-version }}

      - name: Run type checking
        run: |
          uv run ty check mkdocs_exam

      - name: Run Ruff linting
        run: |
          uv run ruff check mkdocs_exam tests

      - name: Run Bandit security checks
        run: |
          uv run bandit -c pyproject.toml -r mkdocs_exam

  javascript:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run JavaScript tests
        run: bun test

      - name: Run Biome linting
        run: bun run lint

      - name: Run TypeScript type checking
        run: bun run typecheck

      - name: Run CSS linting
        run: bun run lint:css

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync --dev
          uv pip install mkdocs

      - name: Run integration tests
        run: |
          uv run pytest tests/integration_test.py -v

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Run Safety check
        run: |
          uv run safety check --json
        continue-on-error: true

      - name: Run Bandit
        run: |
          uv run bandit -c pyproject.toml -r mkdocs_exam -f json
