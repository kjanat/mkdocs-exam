---
default_stages: [pre-commit, pre-push]
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_commit_msg: |
    [pre-commit.ci] pre-commit autoupdate
  autoupdate_schedule: weekly
  submodules: false
  skip: [toml-format-online, toml-lint-online, ty-check, local-biome-check]
fail_fast: false
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: destroyed-symlinks
      - id: name-tests-test
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.5
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v0.6.47
    hooks:
      - id: tombi-format
        alias: toml-format-online
      - id: tombi-lint
        alias: toml-lint-online
      - id: tombi-format
        alias: toml-format-offline
        args: ["--offline"]
      - id: tombi-lint
        alias: toml-lint-offline
        args: ["--offline"]
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.9
    hooks:
      - id: uv-lock
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
  - repo: local
    hooks:
      - id: dprint
        name: dprint
        entry: dprint fmt
        language: system
        pass_filenames: false
      - id: ty
        name: ty-check
        entry: uv run ty check mkdocs_exam
        language: system
        pass_filenames: false
      - id: stylelint
        name: stylelint
        entry: bunx stylelint --fix
        language: system
        types: [css]
      - id: local-biome-check
        name: biome check
        entry: bunx @biomejs/biome check --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        types: [text]
        files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?)$"
  - repo: https://github.com/biomejs/pre-commit
    rev: "v2.3.5" # Use the sha / tag you want to point at
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.3.5"]
