[project]
name = "mkdocs-exam"
version = "0.2.0"
description = "A mkdocs plugin to create an exam in your markdown document."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kaj Kowalski", email = "dev+mkdocs-exam@kjanat.com" }]
dependencies = ["mkdocs", "mkdocs-material"]

[project.urls]
homepage = "https://github.com/kjanat/mkdocs-exam"

[project.entry-points."mkdocs.plugins"]
"mkdocs-exam" = "mkdocs_exam.plugin:MkDocsExamPlugin"

[dependency-groups]
dev = ["pre-commit", "pytest", "pytest-cov>=7.0.0", "ruff", "ty"]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

# [tool.setuptools.packages.find]
# include = ["mkdocs_exam"]
# exclude = ["example*", "assets*", "build*"]

[tool.uv.build-backend]
module-name = "mkdocs_exam"
module-root = ""
# [build-system]
# requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# [tool.setuptools.package-data]
# "mkdocs_exam" = ["css/*", "js/*"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
