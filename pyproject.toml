# :tombi schema.strict = false

[project]
name = "mkdocs-exam"
version = "0.1.0"
description = "A mkdocs plugin to create an exam in your markdown document."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Kaj Kowalski", email = "dev+mkdocs-exam@kjanat.com" },
]
dependencies = [
  "mkdocs",
  "pyyaml",
]

[project.urls]
homepage = "https://github.com/kjanat/mkdocs-exam"

[project.entry-points."mkdocs.plugins"]
"mkdocs-exam" = "mkdocs_exam.plugin:MkDocsExamPlugin"

[dependency-groups]
dev = [
  "bandit[toml]",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "ruff",
  "safety",
  "sphinx",
  "sphinx-autodoc-typehints",
  "sphinx-rtd-theme",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101"] # Skip assert_used check for tests

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
addopts = "--cov=mkdocs_exam --cov-report=term-missing --cov-report=html"

[tool.ruff]
line-length = 120

[tool.setuptools.packages.find]
include = ["mkdocs_exam"]
exclude = ["example*", "assets*", "build*"]

[tool.setuptools.package-data]
"mkdocs_exam" = ["css/*", "js/*"]
